name: familiar_faces

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Built with flutter 3.50.1 • channel stable

version: 1.4.1+7

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  auto_size_text: ^3.0.0
  intl: ^0.20.2
  cached_network_image: ^4.0.7
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.4
  package_info_plus: ^10.2.2
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  file_picker: ^13.4.1

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: false # this library is kind of a pain for android so just using android studio instead
  ios: true
  image_path: "assets/icon/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/